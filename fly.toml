# fly.toml app configuration file generated for surx-registry on 2026-07-11T16:45:54-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'surx-registry'
primary_region = 'gru'

[build]
[env]
  # Canonical public domain, NOT the Fly hostname. This value is baked into the
  # `verify_url` of every receipt the registry issues, and receipts live inside
  # customers' .surx files forever. Pointing it at surx-registry.fly.dev tied
  # every seal ever issued to this specific hosting provider.
  REGISTRY_BASE_URL = 'https://api.surframe.dev'
  REGISTRY_TSA_URL = 'https://freetsa.org/tsr'

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # Health check. /v1/health returns {"ok":true,...} from a cached Registry
  # instance — no DB query, no PEM reload — so a 15s interval costs nothing.
  #
  # Careful with these numbers: a failing check makes fly-proxy pull the machine
  # OUT of rotation, so a misconfigured check takes the registry down rather than
  # protecting it. grace_period must comfortably exceed real startup time; the
  # logs show ~4s from machine start to "Uvicorn running" (volume mount +
  # filesystem check + app boot), so 20s leaves a wide margin and also avoids the
  # spurious "app is not listening on the expected address" warning during
  # rolling deploys.
  [[http_service.checks]]
    method = 'GET'
    path = '/v1/health'
    protocol = 'http'
    interval = '15s'
    timeout = '3s'
    grace_period = '20s'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
